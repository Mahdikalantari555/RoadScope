# Single-command orchestration: spatial database + Next.js app (API, geoprocessing engine, UI) + schema push.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_db }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"], interval: 5s, timeout: 3s, retries: 20 }
    volumes: [pgdata:/var/lib/postgresql/data]
  migrate:
    build: .
    command: sh -c "npx drizzle-kit push --force"
    environment: { DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db }
    depends_on: { db: { condition: service_healthy } }
  app:
    build: .
    command: sh -c "npm run start"
    environment: { DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db, NODE_ENV: production }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"], interval: 10s, retries: 10 }
volumes:
  pgdata: {}
