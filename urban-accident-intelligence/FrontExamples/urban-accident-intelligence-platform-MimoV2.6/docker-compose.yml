# Urban Accident Intelligence — development stack.
# Three services: database, web application, and an optional admin client.
#
#   docker compose up --build
#
# The web service runs the schema push and the deterministic seed on first
# boot, so the console is immediately demonstrable.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      ANALYSIS_CRS: EPSG:25832
      SOURCE_CRS: EPSG:4326
      SYNTHETIC_SEED: "20240917"
      SYNTHETIC_SCENARIO: mixed
      LOG_LEVEL: info
    ports:
      - "3000:3000"

  adminer:
    image: adminer:4
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  db_data:
