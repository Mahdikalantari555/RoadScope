###############################################################################
# Urban Accident Intelligence — single-command deployment
#
#   docker compose up --build
#
# Brings up PostgreSQL 15 and the Next.js/geocomputation runtime, applies the
# relational-spatial schema and starts the platform. On first load the
# application bootstraps its own synthetic ground-truth dataset so that every
# network statistic can be benchmarked against a known λ(s,t).
###############################################################################
services:
  db:
    image: postgres:15-alpine
    container_name: uai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
      # UTC everywhere: all timestamps are stored and reported in UTC.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - uai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uai-platform
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 60s

volumes:
  uai_pgdata:
