services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ROADSCOPE_SQLITE_PATH: /data/uai.sqlite
      ROADSCOPE_CANONICAL_EPSG: ${ROADSCOPE_CANONICAL_EPSG:-${UAI_CANONICAL_EPSG:-25832}}
      ROADSCOPE_WEB_EPSG: ${ROADSCOPE_WEB_EPSG:-${UAI_WEB_EPSG:-4326}}
      ROADSCOPE_DEFAULT_SEED: ${ROADSCOPE_DEFAULT_SEED:-${UAI_DEFAULT_SEED:-42}}
      ROADSCOPE_DEMO_MODE: ${ROADSCOPE_DEMO_MODE:-false}
      ROADSCOPE_API_TOKENS: ${ROADSCOPE_API_TOKENS:-{}}
    volumes:
      - uai_sqlite_data:/data
    ports:
      - "${ROADSCOPE_API_PORT:-${UAI_API_PORT:-8000}}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ROADSCOPE_WEB_PORT:-${UAI_WEB_PORT:-8080}}:80"

volumes:
  # Preserve the existing volume key so upgrades never orphan SQLite data.
  uai_sqlite_data:
