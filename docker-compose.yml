services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ROADSCOPE_SQLITE_PATH: /data/uai.sqlite
      ROADSCOPE_DEMO_MODE: ${ROADSCOPE_DEMO_MODE:-false}
      ROADSCOPE_API_TOKENS: ${ROADSCOPE_API_TOKENS:-{}}
    volumes:
      - roadscope_data:/data
    ports:
      - "${UAI_API_PORT:-8000}:8000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${UAI_WEB_PORT:-8080}:80"
volumes:
  roadscope_data:
    name: ${ROADSCOPE_DATA_VOLUME:-roadscope_uai_sqlite_data}
