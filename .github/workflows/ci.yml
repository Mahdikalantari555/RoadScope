name: RoadScope verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: npm audit --prefix frontend --audit-level=high
      - run: OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@2.0.0 validate --all --strict --no-interactive
